# The ports' tests on the emulator: Doom, Quake, umac, Windows 3.11, the
# NES emulator and the DVD player, started from the SD loader the way a
# unit starts them (tests/disc.rs), and the DVD player on test discs
# (tests/dvd.rs).  No Rust code of its own: the ports are C, built with
# their build scripts and the kit. The emulator, the `rnse` crate, comes
# from git, pinned to a commit of https://github.com/jroark/rnse
# (Cargo.lock pins it too).
[package]
name = "rnse-ports"
version = "0.1.0"
edition = "2021"
description = "Tests of the RNS-E ports (Doom, Quake, umac, Windows 3.11, NES, DVD) on the rnse emulator"
license = "GPL-2.0-only"
publish = false

[dev-dependencies]
rnse = { git = "https://github.com/jroark/rnse", rev = "0e3a2d4ce5941161e17ff4816126281fbcf80088" }

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
